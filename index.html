<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUA</title><style>body{margin:0;background:#02020f;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden} .lua{width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#e0e0e0 30%,#999 70%);box-shadow:0 0 80px white} canvas{position:fixed;inset:0;z-index:-1}</style></head><body><canvas id="s"></canvas><div class="lua"></div><script>c=document.getElementById('s');x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;for(i=0,a=[];i<400;i++)a.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2});setInterval(()=>{x.clearRect(0,0,c.width,c.height);a.forEach(p=>{x.fillStyle='white';x.globalAlpha=Math.random();x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()})},80)</script></body></html>
