<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lua se Mexendo</title>
<style>
body{margin:0;background:#000010;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
canvas{position:fixed;inset:0;z-index:0}
.lua{
 width:300px;height:300px;border-radius:50%;
 background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg') center/110% no-repeat;
 box-shadow:inset -25px -15px 50px #000, 0 0 80px #fff, 0 0 150px #8af5;
 position:relative; z-index:1;
 animation: mexe 5s ease-in-out infinite, gira 60s linear infinite;
}
@keyframes mexe{
 0%,100%{transform: translateY(0) translateX(0) scale(1)}
 25%{transform: translateY(-20px) translateX(10px) scale(1.03)}
 50%{transform: translateY(-10px) translateX(-10px) scale(1)}
 75%{transform: translateY(-25px) translateX(5px) scale(1.02)}
}
@keyframes gira{
 from{filter: brightness(1) hue-rotate(0deg)}
 to{filter: brightness(1.1) hue-rotate(10deg)}
}
p{position:fixed;bottom:25px;z-index:2;color:#fff;font-family:Arial;letter-spacing:8px;font-size:11px;opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="lua"></div>
<p>LUA SE MEXENDO 🌙</p>
