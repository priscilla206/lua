<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lua</title><style>body{margin:0;background:#000011;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}canvas{position:fixed;inset:0}.m{width:300px;height:300px;border-radius:50%;background:url('https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg') center/110% no-repeat;box-shadow:0 0 80px #fff;animation:f 4s ease-in-out infinite;position:relative;z-index:1}@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}</style></head><body><canvas id="c"></canvas><div class="m"></div><script>c=document.getElementById('c');x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let a=[];for(i=0;i<500;i++)a.push({x:Math.random()*c.width,y:Math.random()*c.height});setInterval(()=>{x.clearRect(0,0,c.width,c.height);a.forEach(p=>{x.fillStyle='white';x.globalAlpha=Math.random();x.beginPath();x.arc(p.x,p.y,Math.random()*2,0,7);x.fill()})},100)</script></body></html>
