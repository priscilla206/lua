<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌙</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  body { margin:0; overflow:hidden; background:#000; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.008);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 35, 65);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

// --- LUA NO CENTRO ---
const moonGeo = new THREE.SphereGeometry(8, 64, 64);
const moonMat = new THREE.MeshStandardMaterial({
  color: 0xf5f3ce,
  emissive: 0x222222,
  roughness: 0.8,
  metalness: 0.1
});
const moon = new THREE.Mesh(moonGeo, moonMat);
scene.add(moon);

// brilho da lua
const glowGeo = new THREE.SphereGeometry(9.5, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({ color: 0xffffcc, transparent: true, opacity: 0.15 });
const glow = new THREE.Mesh(glowGeo, glowMat);
scene.add(glow);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(20,30,10);
scene.add(light);

const starGeo = new THREE.BufferGeometry();
const pos = new Float32Array(12000*3);
for(let i=0;i<pos.length;i++) pos[i]=(Math.random()-0.5)*400;
starGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.6, transparent:true, opacity:0.8 })));

function createSunflowerSprite(){
  const canvas = document.createElement('canvas');
  canvas.width=256; canvas.height=256;
  const ctx=canvas.getContext('2d');
  ctx.font="200px serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("✨",118,128);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(canvas) }));
  s.scale.set(4+Math.random()*5,4+Math.random()*5,1);
  return s;
}

const galaxyGroup = new THREE.Group();
scene.add(galaxyGroup);

for(let i=0;i<200;i++){
  const radius = Math.pow(Math.random(),0.7)*85 + 12;
  const angle = (i/3)*0.5 + radius*0.18;
  const x = Math.cos(angle)*radius + (Math.random()-0.5)*6;
  const z = Math.sin(angle)*radius + (Math.random()-0.5)*6;
  const y = (Math.random()-0.5)*12;
  const obj = createSunflowerSprite();
  obj.position.set(x,y,z);
  galaxyGroup.add(obj);
}

function animate(){
  requestAnimationFrame(animate);
  galaxyGroup.rotation.y+=0.0015;
  moon.rotation.y+=0.002;
  controls.update();
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
